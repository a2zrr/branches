name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verif:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js (version du fichier .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lint, types et tests unitaires
        run: npm run verif

      - name: Construire la version de production
        run: npm run build

      - name: Installer Chromium et ses dépendances
        run: npx playwright install --with-deps chromium

      - name: Tests de bout en bout et d'accessibilité
        run: npm run test:e2e

      - name: Rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
